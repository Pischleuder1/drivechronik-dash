<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DriveChronik Dash</title>

<style>
:root {
  color-scheme: dark;
  --bg:#030405;
  --panel:#0a0c0f;
  --line:#20242a;
  --text:#f5f5f5;
  --muted:#7d848b;
  --red:#e62b2b;
  --blue:#3478f6;
  --green:#28b45b;
}

* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.app {
  width:100vw;
  height:100vh;
  display:grid;
  grid-template-rows:38px 1fr;
  padding:8px 16px 10px;
}

header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}

.brand {
  font-size:12px;
  font-weight:700;
  letter-spacing:.16em;
}

.connection {
  color:var(--muted);
  font-size:11px;
}

main {
  display:grid;
  grid-template-columns:1.45fr .8fr;
  min-height:0;
}

/* LINKER TACHO-KPI */

.tacho-kpi {
  position:relative;
  border-right:1px solid var(--line);
  display:grid;
  grid-template-rows:1fr 108px;
  min-height:0;
}

.tacho-area {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.speedometer {
  position:relative;
  width:min(41vw,64vh);
  aspect-ratio:1;
  border-radius:50%;

  background:
    radial-gradient(circle at center,#070a0d 0 59%,transparent 60%),
    conic-gradient(
      from 225deg,
      #444a52 0deg,
      #444a52 270deg,
      transparent 270deg
    );
}

.speedometer::after {
  content:"";
  position:absolute;
  inset:8%;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
}

.tick {
  position:absolute;
  left:50%;
  top:50%;
  width:2px;
  height:9px;
  background:#666d74;

  transform-origin:50% calc(50% + var(--radius));
  transform:
    translate(-50%,calc(-50% - var(--radius)))
    rotate(var(--angle));
}

.tick.major {
  width:3px;
  height:15px;
  background:#c7cbd0;
}

.speed-label {
  position:absolute;
  left:50%;
  top:50%;
  color:#80878e;
  font-size:12px;

  transform:
    translate(-50%,-50%)
    rotate(var(--angle))
    translateY(calc(var(--labelRadius) * -1))
    rotate(calc(var(--angle) * -1));
}

.needle {
  position:absolute;
  left:50%;
  top:50%;
  width:5px;
  height:39%;

  background:linear-gradient(to top,#db2020,#ff5d5d);
  border-radius:6px;

  transform-origin:50% 93%;
  transform:translate(-50%,-93%) rotate(-135deg);

  transition:transform .3s ease;
  z-index:7;
}

.needle-center {
  position:absolute;
  left:50%;
  top:50%;

  width:28px;
  height:28px;

  transform:translate(-50%,-50%);
  border-radius:50%;

  background:#df2929;
  border:6px solid #151719;

  z-index:10;
}

.digital-speed {
  position:absolute;
  left:50%;
  top:67%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.speed-number {
  font-size:78px;
  line-height:.9;
  font-weight:300;
  letter-spacing:-.05em;
}

.speed-unit {
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
}

.gear {
  margin-left:10px;
  color:#fff;
  font-size:21px;
  font-weight:600;
}

/* TEMPOLIMIT IM TACHO-KPI */

.limit-box {
  position:absolute;
  top:18px;
  right:22px;

  display:flex;
  flex-direction:column;
  align-items:center;

  z-index:20;
}

.limit-label {
  margin-bottom:7px;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  letter-spacing:.11em;
  text-transform:uppercase;
}

.limit-sign {
  width:104px;
  height:104px;

  border-radius:50%;
  border:9px solid #df2020;

  background:#fff;
  color:#080808;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:43px;
  font-weight:700;
}

/* RESTENERGIE */

.energy-panel {
  border-top:1px solid var(--line);
  padding:12px 20px 10px;
}

.energy-head {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
}

.energy-title {
  color:var(--muted);
  font-size:16px;
  font-weight:700;
  letter-spacing:.12em;
}

.energy-value {
  font-size:25px;
  font-weight:500;
  font-variant-numeric:tabular-nums;
}

.energy-value small {
  color:var(--muted);
  font-size:12px;
}

.energy-track {
  position:relative;

  height:17px;
  margin-top:11px;

  overflow:hidden;
  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #e32b2b 0%,
      #db3439 12%,
      #a84875 26%,
      #6360bc 39%,
      #3478f6 50%,
      #318bc9 61%,
      #2c9d95 72%,
      #2aad70 84%,
      #28b45b 100%
    );
}

.energy-empty {
  position:absolute;
  right:0;
  top:0;
  height:100%;

  width:29%;

  background:rgba(4,5,6,.82);
}

.energy-marker {
  position:absolute;
  top:-4px;

  width:3px;
  height:25px;

  left:71%;

  background:#fff;
}

.energy-scale {
  display:flex;
  justify-content:space-between;

  margin-top:7px;

  color:var(--muted);
  font-size:16px;
}


.kpi-wide {
  grid-column:1 / 3;
}

.kpi-inline-unit {
  margin-left:5px;
  color:var(--muted);
  font-size:.48em;
  font-weight:500;
}

/* RECHTE KPIs */

.right {
  padding:12px;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:10px;
}

.kpi {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;

  display:flex;
  flex-direction:column;
  justify-content:center;
}

.kpi-title {
  color:var(--muted);
  font-size:16px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.kpi-value {
  margin-top:9px;
  font-size:42px;
  line-height:1;
  font-weight:500;
  font-variant-numeric:tabular-nums;
}

.kpi-unit {
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}
</style>

<style id="smartphone-landscape">

   Smartphone Landscape
   Zielbereich etwa:
   780–1000 px Breite
   350–480 px Höhe

<body>

<div class="app">

<header>
  <div class="brand">DRIVECHRONIK DASH</div>
  <div class="connection">● Tesla BLE</div>
</header>

<main>

<section class="tacho-kpi">

  <div class="tacho-area">

    <div class="limit-box">
      <div class="limit-sign">100</div>
    </div>

    <div class="speedometer" id="speedometer">

      <div class="needle" id="needle"></div>
      <div class="needle-center"></div>

      <div class="digital-speed">
        <div class="speed-number" id="speed">96</div>

        <div class="speed-unit">
          km/h
          <span class="gear">D</span>
        </div>
      </div>

    </div>

  </div>

  <div class="energy-panel">

    <div class="energy-head">

      <div class="energy-title">
        RESTENERGIE
      </div>

      <div class="energy-value">
        <span id="energyKwh">42.6</span>
        <small>kWh</small>
      </div>

    </div>

    <div class="energy-track">

      <div
        class="energy-empty"
        id="energyEmpty">
      </div>

      <div
        class="energy-marker"
        id="energyMarker">
      </div>

    </div>

    <div class="energy-scale">
      <span>0%</span>
      <span>25%</span>
      <span>50%</span>
      <span>75%</span>
      <span>100%</span>
    </div>

  </div>

</section>


<section class="right">

  <div class="kpi">
    <div class="kpi-title">Leistung</div>
    <div class="kpi-value">
      <span id="power">15.1</span>
      <span class="kpi-inline-unit">kW</span>
    </div>
  </div>

  <div class="kpi">
    <div class="kpi-title">Reichweite</div>
    <div class="kpi-value">
      318
      <span class="kpi-inline-unit">km</span>
    </div>
  </div>

</section>

</main>

</div>


<script>
const MAX_SPEED = 200;

/*
  In der Simulation zunächst 60 kWh
  nutzbare Batterie angenommen.
  Später ersetzen wir das durch den
  tatsächlichen Tesla-Wert.
*/
const MAX_ENERGY_KWH = 60.0;

const speedometer =
  document.getElementById("speedometer");


for (let speed = 0; speed <= MAX_SPEED; speed += 5) {

  /*
     0 km/h   = -135°
     100 km/h =    0°
     200 km/h = +135°
  */
  const angle =
    -135 + (speed / MAX_SPEED) * 270;

  const rad =
    angle * Math.PI / 180;

  /*
     Position auf dem äußeren Kreis.
     Winkel 0° zeigt nach oben.
  */
  const radius =
    speed % 25 === 0
      ? 42.0
      : speed % 10 === 0
        ? 42.7
        : 43.2;

  const x =
    50 + Math.sin(rad) * radius;

  const y =
    50 - Math.cos(rad) * radius;

  const tick =
    document.createElement("div");

  if (speed % 25 === 0) {
    tick.className = "tick major";
  }
  else if (speed % 10 === 0) {
    tick.className = "tick medium";
  }
  else {
    tick.className = "tick minor";
  }

  tick.style.left = x + "%";
  tick.style.top = y + "%";

  tick.style.transform =
    `translate(-50%, -50%) rotate(${angle}deg)`;

  speedometer.appendChild(tick);


  /*
     Zahlen nur alle 50 km/h
  */
  if (speed % 50 === 0) {

    const labelRadius = 35.5;

    const lx =
      50 + Math.sin(rad) * labelRadius;

    const ly =
      50 - Math.cos(rad) * labelRadius;

    const label =
      document.createElement("div");

    label.className =
      "speed-label";

    label.textContent =
      speed;

    label.style.left =
      lx + "%";

    label.style.top =
      ly + "%";

    label.style.transform =
      "translate(-50%, -50%)";

    speedometer.appendChild(label);
  }
}



function updateSpeed(speed) {

  const s =
    Math.max(
      0,
      Math.min(MAX_SPEED,speed)
    );

  const angle =
    -135 + (s/MAX_SPEED)*270;

  document
    .getElementById("needle")
    .style.transform =
      `translate(-50%,-93%) rotate(${angle}deg)`;

  document
    .getElementById("speed")
    .textContent =
      Math.round(speed);
}


function updateEnergy(kwh) {

  const percentage =
    Math.max(
      0,
      Math.min(
        100,
        kwh / MAX_ENERGY_KWH * 100
      )
    );

  document
    .getElementById("energyKwh")
    .textContent =
      kwh.toFixed(1);

  document
    .getElementById("energyMarker")
    .style.left =
      percentage + "%";

  document
    .getElementById("energyEmpty")
    .style.width =
      (100-percentage) + "%";
}


let t=0;

setInterval(()=>{

  t += .12;

  const speed =
    96 + Math.sin(t)*10;

  const power =
    15.1 +
    Math.sin(t*1.65)*6;

  const remainingKwh =
    42.6 +
    Math.sin(t*.3)*1.3;


  updateSpeed(speed);

  updateEnergy(
    remainingKwh
  );

  document
    .getElementById("power")
    .textContent =
      power.toFixed(1);

},400);
</script>
