name: Android APK Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android-build:
    name: Build and Test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Install German Vosk voice model
        run: |
          bash scripts/install-voice-model.sh
          test -f app/src/main/assets/drivechronik-voice/uuid
          test -d app/src/main/assets/drivechronik-voice/am
          test -d app/src/main/assets/drivechronik-voice/graph

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(grep -m1 "versionName =" app/build.gradle.kts | cut -d '"' -f2)
          test -n "$VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/DriveChronik-Dash-v${VERSION}-debug.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: drivechronik-dash-debug-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error
